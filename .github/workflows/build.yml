name: Build Windows and macOS desktop versions

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win, arch: x64, runner: windows-2025, rust: x86_64-pc-windows-msvc }
          - { platform: mac, arch: universal, runner: macos-15, rust: universal }
    defaults:
      run:
        shell: bash
    env:
      CI_PLATFORM: ${{ matrix.platform }}
      CI_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('package.json', encoding='utf-8'))['version']
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/') and ref != f'refs/tags/v{version}':
              raise SystemExit('Tag must match package.json version')
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              from scripts.publish_release import release_tag
              release_tag(version)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Check desktop state and proxy behavior
        run: npm run test:electron
      - name: Check list request cancellation
        run: npm run test:logic
      - name: Check release authorization and artifact collection
        run: python -m unittest discover -s tests -p 'test_release_pipeline.py' -v
      - name: Check frontend types
        run: npm run typecheck
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [[ "$CI_ARCH" == universal ]]; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
          else
            rustup target add '${{ matrix.rust }}'
          fi
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('service/Cargo.lock') }}
      - name: Test Rust service
        run: cargo test --locked --manifest-path service/Cargo.toml
      - name: Compile Rust service
        run: |
          mkdir -p service/target/release
          if [[ "$CI_ARCH" == universal ]]; then
            cargo build --release --locked --manifest-path service/Cargo.toml --target x86_64-apple-darwin
            cargo build --release --locked --manifest-path service/Cargo.toml --target aarch64-apple-darwin
            lipo -create service/target/x86_64-apple-darwin/release/sctranslate-service service/target/aarch64-apple-darwin/release/sctranslate-service -output service/target/release/sctranslate-service
            chmod +x service/target/release/sctranslate-service
          else
            cargo build --release --locked --manifest-path service/Cargo.toml --target '${{ matrix.rust }}'
            binary=sctranslate-service
            if [[ "$CI_PLATFORM" == win ]]; then binary=sctranslate-service.exe; fi
            cp "service/target/${{ matrix.rust }}/release/$binary" "service/target/release/$binary"
          fi
      - name: Build frontend
        run: npm run generate
      - name: Record build source
        run: node scripts/write-build-info.mjs
      - name: Package application
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "$CI_PLATFORM" in
            win) npx electron-builder --win nsis portable zip --${{ matrix.arch }} --publish never --config.directories.output=release/ci ;;
            mac) npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never --config.directories.output=release/ci ;;
          esac
      - name: Collect packages and checksums
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/ci_artifacts.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: ScTranslateKit-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: >-
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          matrix.arch == 'x64' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ScTranslateKit-*
          path: release-assets
          merge-multiple: true
      - name: Publish all packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish_release.py
      - name: Remove published workflow artifacts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          from scripts.publish_release import cleanup_run_artifacts
          cleanup_run_artifacts(os.environ['GH_REPO'], os.environ['GITHUB_RUN_ID'])
          PY
